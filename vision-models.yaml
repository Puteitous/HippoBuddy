# 支持视觉的模型名正则模式（大小写不敏感）
# 匹配模型名的任意位置包含该模式即视为支持
vision_model_patterns:
  # ---- OpenAI ----
  # - "^gpt-5"
  # - "^gpt-5\\."
  # ---- Anthropic ----
  # - "^claude-opus-4\\."
  # - "^claude-sonnet-4\\."
  # - "^claude-mythos"
  # - "^claude-fable"
  # ---- Meta ----
  # - "^llama-4"
  # - "^llama-3.*vision"
  # ---- Microsoft ----
  # - "^phi-4.*multi"
  # - "^phi-4.*vision"
  # ---- 阿里（含 vl/omni/image 的才支持视觉） ----
  # - "qwen.*vl"
  # - "qwen3\\.5-omni"
  # - "qwen-image"
  # ---- 智谱（只有含 v/ocr 的版本支持视觉，纯数字如 glm-5.1 是纯文本） ----
  # - "glm-\\d.*v"     # 匹配 glm-4v, glm-4.6v, glm-5v 等
  # - "glm-ocr"
  # ---- 月之暗面（k2.5+ 原生多模态，纯文本的 moonshot-v1 不含 vision 不会被匹配） ----
  # - "^kimi-k"
  # - "moonshot.*vision-preview"
