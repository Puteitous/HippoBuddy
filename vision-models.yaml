# ============================================================
# 视觉模型配置 — 扩展 VisionModelRegistry 的硬编码列表
# ============================================================
# 将此文件放在 config.yaml 同级目录下即可生效。
# 配置会与代码内置的硬编码列表合并（外部的追加到内置列表之后）。
#
# 三种配置方式（优先级从高到低）：
#   1. config.yaml 中的 llm.vision_supported: true/false（手动强制开关）
#   2. 本文件的列表（扩展内置列表）
#   3. 代码内置硬编码列表（兜底）
# ============================================================

# 支持视觉的 provider 名称（大小写不敏感）
# 该 provider 下的所有模型默认支持视觉
vision_providers:
  # - google
  # - gemini

# 支持视觉的精确模型名（大小写不敏感）
vision_models_exact:
  # ---- DeepSeek（含 vision 的视觉实验版） ----
  - deepseek-v4-flash-vision-exp
  # ---- OpenAI ----
  # - gpt-5.2
  # - gpt-5.2-instant
  # - gpt-5.2-thinking
  # - gpt-5.2-pro
  # - gpt-5.4-pro
  # - gpt-5.5
  # - gpt-5-vision
  # ---- Anthropic ----
  # - claude-opus-4.5
  # - claude-opus-4.8
  # - claude-sonnet-4.5
  # - claude-mythos-5
  # - claude-fable-5
  # ---- Meta ----
  # - llama-4-scout
  # - llama-4-maverick
  # - llama-3-vision-70b
  # ---- Microsoft ----
  # - phi-4-multimodal
  # - phi-4-reasoning-vision
  # ---- 阿里 Qwen（注意：qwen3 文本系列不含 vl/omni 的不支持视觉！） ----
  # - qwen3.5-omni-plus        # 全模态（图/文/音/视频）
  # - qwen3.5-omni-flash       # 全模态轻量版
  # - qwen3-vl-235b
  # - qwen2.5-vl-72b
