    <!-- ===== i18n DOM 翻译初始化 ===== -->
    <script>
    // 页面加载后应用翻译到所有 data-i18n 属性元素
    // 语言切换时也会重新应用
    function applyI18nToHTML() {
      if (window.i18n) {
        i18n.applyToDOM();
        // 通过 ID 设置已知元素的翻译（兼容没有 data-i18n 属性的元素）
        const map = {
          'activityPanelTitle':      'activity.panel',
          'sessionHeaderTitle':      'session.title',
          'splashSkipHint':          'html.splash.skip',
          'diffModalTitle':          'diff.title',
          'promptModalTitle':        'promptModal.title',
          'promptModalText':         'promptModal.placeholder',
          'promptModalHint':         'promptModal.hint',
          'promptModalCancel':       'promptModal.cancel',
          'promptModalSave':         'promptModal.apply',
          'heroInput':               'chat.heroPlaceholder',
          'messageInput':            'chat.placeholder',
          'deleteConfirmModalText':  'deleteConfirm.message',
          'deleteConfirmCancel':     'deleteConfirm.cancel',
          'deleteConfirmOk':         'deleteConfirm.confirm',
          'fileTreeEmpty':           'session.openWorkspace',
          'chatNewBtn':              'chat.newSession',
          'chatCollapseBtn':         'chat.collapse',
          'chatShowBtn':             'chat.expand',
          'newMsgHint':              'chat.scrollToBottom',
          'sendBtn':                 'chat.sendMessage',
          'stopBtn':                 'chat.stop',
          'chatHistoryBtn':          'chat.history',
          'previewCollapseBtn':      'preview.collapse',
          'previewMdToggleBtn':      'preview.mdToggle',
          'previewHtmlToggleBtn':    'preview.htmlToggle',
          'previewSearchBtn':        'preview.search',
          'previewRefreshBtn':       'preview.refresh',
          'previewOpenInOfficeBtn':  'preview.openExternal',
          'compactBtn':              'html.header.compressContext',
          'desktopOpenFolderBtn':    'html.header.openFolder',
          'settingsBtn':             'html.header.settings',
          'themeToggle':             'html.header.themeToggle',
          'devtoolsBtn':             'html.header.devtools',
          'refreshBtn':              'html.header.refresh',
          'winMinimize':             'html.header.minimize',
          'winMaximize':             'html.header.maximize',
          'winClose':                'html.header.close',
          'workspaceClear':          'html.header.resetWorkspace',
          'statusBarToken':          'chat.tokenUsage',
          'statusBarFiles':          'fileChanges.title',
          'statusBarModelSelector':  'chat.modelQuickSelect',
          'recentFoldersHeader':     'html.header.recentFolders',
        };
        for (const [id, key] of Object.entries(map)) {
          const el = document.getElementById(id);
          if (el) {
            if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') {
              if (el.hasAttribute('placeholder')) el.placeholder = i18n.t(key);
            } else if (el.hasAttribute('title')) {
              el.title = i18n.t(key);
            } else {
              el.textContent = i18n.t(key);
            }
          }
        }
        // 活动栏按钮 title
        const abBtns = {
          'abTokenBtn':    'activity.token',
          'abMonitorBtn':  'activity.monitor',
          'abFilesBtn':    'activity.files',
          'abTermBtn':     'activity.terminal',
          'abBrowserBtn':  'activity.browser',
          'abSkillBtn':    'activity.skillMarket',
        };
        for (const [id, key] of Object.entries(abBtns)) {
          const el = document.getElementById(id);
          if (el) el.title = i18n.t(key);
        }
        // 会话面板按钮
        const sessionBtns = {
          'sessionToggleBtn':    'html.header.sessionPanel',
          'newSessionBtn':       'html.header.newSession',
          'activityBarToggleBtn':'html.header.toggleActivity',
        };
        for (const [id, key] of Object.entries(sessionBtns)) {
          const el = document.getElementById(id);
          if (el) el.title = i18n.t(key);
        }
        // 胶囊视图按钮
        const capsuleBtns = {
          'capsuleSessions':    'session.sessionList',
          'capsuleFiles':       'session.fileBrowse',
        };
        for (const [id, key] of Object.entries(capsuleBtns)) {
          const el = document.getElementById(id);
          if (el) el.title = i18n.t(key);
        }
      }
    }
    // 监听语言切换事件
    window.addEventListener('i18n:change', applyI18nToHTML);
    // 页面加载完成后立即执行
    if (document.readyState === 'complete') {
      applyI18nToHTML();
    } else {
      document.addEventListener('DOMContentLoaded', applyI18nToHTML);
    }
    </script>
