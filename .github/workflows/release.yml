name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================
  # 第一阶段：构建后端 JAR + 前端资源（跨平台共享）
  # ============================================================
  build-jar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      jar_name: ${{ steps.locate_jar.outputs.jar_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend vendor (CodeMirror + OOXML)
        run: npm run build:vendor

      - name: Build React frontend (vite → static-v2)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend JAR
        run: mvn package -DskipTests --batch-mode

      - name: Locate JAR file
        id: locate_jar
        shell: bash
        run: |
          JAR=$(ls target/*.jar | grep -v '/original-' | head -n 1)
          if [ -z "$JAR" ]; then echo "No JAR found in target/" && exit 1; fi
          echo "jar_name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: hippo-agent-jar
          path: target/${{ steps.locate_jar.outputs.jar_name }}
          retention-days: 3

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/main/resources/static/
          retention-days: 3

      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

  # ============================================================
  # 第二阶段：Windows 打包
  # ============================================================
  build-win:
    needs: build-jar
    runs-on: windows-latest
    env:
      ELECTRON_CACHE: electron\.electron-cache
      ELECTRON_BUILDER_CACHE: electron\.builder-cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (for jlink)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: hippo-agent-jar
          path: target/

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: src/main/resources/static/

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            electron\.electron-cache
            electron\.builder-cache
          key: win-electron-${{ hashFiles('electron/package-lock.json') }}

      - name: Set version from tag
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF" -replace 'refs/tags/v', ''
          (Get-Content electron/package.json) -replace '"version": ".*"', "`"version`": `"$version`"" | Set-Content electron/package.json
          Write-Host "Version set to: $version"

      - name: Install Electron dependencies
        run: cd electron && npm ci

      - name: Setup JAR in resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path electron/resources | Out-Null
          Copy-Item target/${{ needs.build-jar.outputs.jar_name }} electron/resources/hippo-agent.jar -Force

      - name: Generate trimmed JRE with jlink
        shell: pwsh
        run: |
          $JreOut = "electron/resources/jre"
          $Modules = "java.base,java.desktop,java.instrument,java.logging,java.management,java.naming,java.net.http,java.security.jgss,java.sql,java.xml,java.xml.crypto,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.httpserver"
          jlink --module-path "$Env:JAVA_HOME\jmods" --add-modules $Modules --output $JreOut --strip-debug --compress zip-6 --no-header-files --no-man-pages --vm server

      - name: Build Windows installer
        run: cd electron && npx electron-builder --win --x64 --publish=never

      - name: Upload Windows installer to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/release/HippoBuddy*.exe
            electron/release/latest.yml
            electron/release/*.blockmap
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 第三阶段：macOS 打包
  # ============================================================
  build-mac:
    # 用 matrix 分别打 x64 与 arm64 两个 mac 包：
    # 各自在原生架构 runner 上 jlink + 打包，确保内置 JRE 与 App 架构一致。
    needs: build-jar
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            target: --x64
            runner: macos-26-intel
            cache: mac-x64-electron
          - name: arm64
            target: --arm64
            runner: macos-latest
            cache: mac-arm64-electron
    env:
      ELECTRON_CACHE: electron/.electron-cache
      ELECTRON_BUILDER_CACHE: electron/.builder-cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (for jlink)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: hippo-agent-jar
          path: target/

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: src/main/resources/static/

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            electron/.electron-cache
            electron/.builder-cache
          key: ${{ matrix.cache }}-${{ hashFiles('electron/package-lock.json') }}

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" electron/package.json
          echo "Version set to: $VERSION"

      - name: Install Electron dependencies
        run: cd electron && npm ci

      - name: Setup JAR in resources
        run: |
          mkdir -p electron/resources
          cp target/${{ needs.build-jar.outputs.jar_name }} electron/resources/hippo-agent.jar

      - name: Generate trimmed JRE with jlink
        run: |
          MODULES="java.base,java.desktop,java.instrument,java.logging,java.management,java.naming,java.net.http,java.security.jgss,java.sql,java.xml,java.xml.crypto,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.httpserver"
          jlink --module-path "$JAVA_HOME/jmods" \
            --add-modules "$MODULES" \
            --output electron/resources/jre \
            --strip-debug --compress zip-6 --no-header-files --no-man-pages --vm server

      - name: Build macOS DMG (${{ matrix.name }})
        run: cd electron && npx electron-builder --mac ${{ matrix.target }} --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 冒烟测试：在 macOS runner 上真实启动打包后的 .app，
      # 验证「内置 JRE + hippo-agent.jar → 后端启动 → /cockpit 可访问」整条链路。
      # 任何一步失败都会输出主进程日志并让本 job 报错。
      - name: Smoke test macOS app
        shell: bash
        run: |
          # 1. 根据 runner 架构选择匹配的打包产物 .app
          if [ "$(uname -m)" = "arm64" ]; then
            APP="electron/release/mac-arm64/HippoBuddy.app"
            [ -d "$APP" ] || APP="electron/release/mac/HippoBuddy.app"
          else
            APP="electron/release/mac/HippoBuddy.app"
            [ -d "$APP" ] || APP="electron/release/mac-arm64/HippoBuddy.app"
          fi
          if [ ! -d "$APP" ]; then
            echo "ERROR: 未找到打包好的 HippoBuddy.app"
            ls -R electron/release
            exit 1
          fi
          echo "Bundled app: $APP (arch: $(uname -m))"

          # 2. 产物自检：内置 JRE 与 JAR 必须存在
          [ -f "$APP/Contents/Resources/jre/bin/java" ] || { echo "ERROR: 缺少内置 JRE"; exit 1; }
          [ -f "$APP/Contents/Resources/hippo-agent.jar" ] || { echo "ERROR: 缺少 hippo-agent.jar"; exit 1; }
          echo "OK: 内置 JRE 与 hippo-agent.jar 均已就位"

          # 3. 清理 9090 端口残留，避免干扰
          if lsof -ti tcp:9090 >/dev/null 2>&1; then
            echo "WARN: 端口 9090 已被占用，清理"
            lsof -ti tcp:9090 | xargs kill -9 || true
            sleep 2
          fi

          # 4. 直接执行主进程二进制以捕获日志，后台运行
          LOG=/tmp/hippo-smoke.log
          rm -f "$LOG"
          "$APP/Contents/MacOS/HippoBuddy" >"$LOG" 2>&1 &
          APP_PID=$!
          echo "Launched main process PID=$APP_PID"

          # 5. 轮询后端就绪（最多 120s）
          READY=0
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:9090/cockpit" || echo 000)
            if [ "$code" = "200" ]; then
              READY=1
              echo "SMOKE OK: /cockpit HTTP 200（第 $i 次探测）"
              break
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "ERROR: 主进程提前退出（第 $i 次探测）"
              break
            fi
            sleep 1
          done

          if [ "$READY" != "1" ]; then
            echo "=== SMOKE FAILED ==="
            echo "--- 主进程日志 ---"
            cat "$LOG" || true
            exit 1
          fi
          echo "PASS: macOS app 启动成功，后端就绪，/cockpit 可访问"

          # 6. 清理：关闭应用与后端
          kill -9 $APP_PID 2>/dev/null || true
          pkill -f "hippo-agent.jar" 2>/dev/null || true
          echo "SMOKE TEST COMPLETE"

      - name: Upload macOS DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/release/HippoBuddy*.dmg
            electron/release/latest-mac.yml
            electron/release/*.blockmap
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 第四阶段：Linux 打包
  # ============================================================
  build-linux:
    needs: build-jar
    runs-on: ubuntu-latest
    env:
      ELECTRON_CACHE: electron/.electron-cache
      ELECTRON_BUILDER_CACHE: electron/.builder-cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (for jlink)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: hippo-agent-jar
          path: target/

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: src/main/resources/static/

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            electron/.electron-cache
            electron/.builder-cache
          key: linux-electron-${{ hashFiles('electron/package-lock.json') }}

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" electron/package.json
          echo "Version set to: $VERSION"

      - name: Install Electron dependencies
        run: cd electron && npm ci

      - name: Setup JAR in resources
        run: |
          mkdir -p electron/resources
          cp target/${{ needs.build-jar.outputs.jar_name }} electron/resources/hippo-agent.jar

      - name: Generate trimmed JRE with jlink
        run: |
          MODULES="java.base,java.desktop,java.instrument,java.logging,java.management,java.naming,java.net.http,java.security.jgss,java.sql,java.xml,java.xml.crypto,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.httpserver"
          jlink --module-path "$JAVA_HOME/jmods" \
            --add-modules "$MODULES" \
            --output electron/resources/jre \
            --strip-debug --compress zip-6 --no-header-files --no-man-pages --vm server

      - name: Build Linux AppImage
        run: cd electron && npx electron-builder --linux --x64 --publish=never

      - name: Upload Linux AppImage to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/release/HippoBuddy*.AppImage
            electron/release/latest-linux.yml
            electron/release/*.blockmap
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
